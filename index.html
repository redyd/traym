<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>traym</title>
    <!-- boot screen: plain HTML/CSS, painted before any script loads; neutral, since the theme isn't known yet -->
    <style>
      html, body { margin: 0; height: 100%; background: #18181b; }
      #boot {
        position: fixed; inset: 0; z-index: 1000;
        display: grid; place-items: center;
        background: #18181b; color: #a1a1aa;
        font: 600 15px/1 system-ui, sans-serif; letter-spacing: .02em;
        transition: opacity .25s ease;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot div { display: grid; justify-items: center; gap: 14px; }
      /* indeterminate bar: the pull has no measurable progress */
      #boot i { width: 160px; height: 3px; border-radius: 3px; background: #3f3f46; overflow: hidden; position: relative; }
      #boot i::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #a1a1aa; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-color-scheme: light) {
        html, body, #boot { background: #f4f4f5; }
        #boot { color: #52525b; }
        #boot i { background: #d4d4d8; }
        #boot i::after { background: #52525b; }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div>traym<i></i></div></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
