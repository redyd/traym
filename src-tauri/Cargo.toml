[package]
name = "traym"
version = "0.2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.9"
getrandom = "0.3"
notify = "8.2.2"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "net", "time"] }
trash = "5.3.0"

[dev-dependencies]
tempfile = "3.27.0"
